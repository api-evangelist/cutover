apis:
- name: Cutover Core API
  description: 'The Cutover Core API is a RESTful, JSON:API-style interface for programmatically
    managing workspaces, runbooks, tasks, teams, and users in the Cutover collaborative
    automation platform. It uses predictable resource-oriented URLs, standard HTTP
    methods (GET, POST, PATCH, DELETE), bearer User App Token authentication, date-based
    API versioning via an Api-Version header, page-based pagination, and a JSON:API
    errors[] envelope. It powers runbook creation from templates, task orchestration,
    user and team administration, and integration-driven automation.'
