name: Cutover
description: 'Cutover is a collaborative automation and IT resilience platform that
  codifies operational work as task-led runbooks for IT disaster recovery, application
  recovery, major incident management, and complex change and release events. The
  platform combines automated runbooks, real-time dashboards, immutable audit trails,
  and AI-assisted orchestration to reduce mean time to resolution and meet recovery
  time objectives across hybrid and multi-cloud estates. Cutover exposes a RESTful
  Core API (JSON:API-style envelopes, bearer User App Token authentication) for programmatically
  managing workspaces, runbooks, tasks, teams, and users, plus outbound event/webhook
  integrations, an open-source MCP server, and a broad third-party integration suite
  (ServiceNow, Jira, Datadog, AWS, Ansible, Jenkins, Slack, Microsoft Teams and more).'
